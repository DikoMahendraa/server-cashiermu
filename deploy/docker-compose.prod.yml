# Production stack: PostgreSQL + the API + Caddy (HTTPS in front). Run from this folder:
#   docker compose -f docker-compose.prod.yml up -d --build
# Variables come from deploy/.env (copy .env.example). Full steps: docs/15-deployment.md
name: cashiermu

# Docker keeps every container's output in a file that grows forever by default and can fill the disk.
# This caps each container at 3 files of 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashiermu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: cashiermu
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashiermu -d cashiermu']
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5433:5432' # localhost-only: accessible via SSH tunnel, not from the internet
    networks: [internal]

  api:
    logging: *default-logging
    build:
      context: ..
      dockerfile: Dockerfile
    image: cashiermu-api:latest
    restart: unless-stopped
    init: true # proper signal handling and zombie reaping for the node process
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://cashiermu:${POSTGRES_PASSWORD}@db:5432/cashiermu
      LOG_FILE: /app/logs/api.log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
    networks: [internal]
    expose: ['3000']

  # Sends metrics and logs to Grafana Cloud and receives the app's telemetry. Opt-in: start it with
  #   docker compose -f docker-compose.prod.yml --profile monitoring up -d
  # after filling the GC_* values in .env (see docs/18-grafana-cloud.md).
  alloy:
    profiles: [monitoring]
    logging: *default-logging
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      API_TARGET: api:3000
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GC_PROM_URL: ${GC_PROM_URL:-}
      GC_PROM_USER: ${GC_PROM_USER:-}
      GC_LOKI_URL: ${GC_LOKI_URL:-}
      GC_LOKI_USER: ${GC_LOKI_USER:-}
      GC_API_KEY: ${GC_API_KEY:-}
      FARO_API_KEY: ${FARO_API_KEY:-}
    volumes:
      - ../monitoring/alloy/config.cloud.alloy:/etc/alloy/config.alloy:ro
      - api-logs:/var/log/cashiermu:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [api]
    networks: [internal]
    expose: ['12347']

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.cashiermu.com}
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:-telemetry.cashiermu.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates live here: keep this volume
      - caddy-config:/config
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  db-data:
  api-logs:
  caddy-data:
  caddy-config:
  alloy-data:
